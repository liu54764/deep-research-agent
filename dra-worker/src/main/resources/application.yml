server:
  port: ${WORKER_PORT:8081}

spring:
  application:
    name: dra-worker
  main:
    web-application-type: none
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/dra?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration

dra:
  temporal:
    target: ${TEMPORAL_TARGET:127.0.0.1:7233}
    namespace: ${TEMPORAL_NAMESPACE:default}
  search:
    provider: ${DRA_SEARCH_PROVIDER:mock}
    tavily-api-key: ${TAVILY_API_KEY:}
    tavily-base-url: ${TAVILY_BASE_URL:https://api.tavily.com}
    tavily-search-depth: ${TAVILY_SEARCH_DEPTH:basic}
    timeout-seconds: ${TAVILY_TIMEOUT_SECONDS:30}
  fetch:
    mode: ${DRA_FETCH_MODE:stub}
    timeout-seconds: ${DRA_FETCH_TIMEOUT_SECONDS:20}
    max-bytes: ${DRA_FETCH_MAX_BYTES:3145728}
    max-redirects: ${DRA_FETCH_MAX_REDIRECTS:3}
    user-agent: ${DRA_FETCH_USER_AGENT:DeepResearchAgent/0.1}
    allow-private-for-tests: false
  http:
    proxy: ${DRA_HTTP_PROXY:}
    connect-timeout-seconds: ${DRA_HTTP_CONNECT_TIMEOUT_SECONDS:10}
  llm:
    enabled: ${DRA_LLM_ENABLED:false}
    base-url: ${DRA_LLM_BASE_URL:https://api.deepseek.com}
    api-key: ${DRA_LLM_API_KEY:}
    plan-model: ${DRA_LLM_PLAN_MODEL:deepseek-chat}
    extract-model: ${DRA_LLM_EXTRACT_MODEL:deepseek-chat}
    claim-model: ${DRA_LLM_CLAIM_MODEL:deepseek-chat}
    verify-model: ${DRA_LLM_VERIFY_MODEL:deepseek-reasoner}
    plan-temperature: ${DRA_LLM_PLAN_TEMPERATURE:0.2}
    extract-temperature: ${DRA_LLM_EXTRACT_TEMPERATURE:0.1}
    verify-temperature: ${DRA_LLM_VERIFY_TEMPERATURE:0.0}
    max-tokens: ${DRA_LLM_MAX_TOKENS:4096}
    connect-timeout-seconds: ${DRA_LLM_CONNECT_TIMEOUT_SECONDS:10}
    read-timeout-seconds: ${DRA_LLM_READ_TIMEOUT_SECONDS:90}
    input-micros-per-million-tokens: ${DRA_LLM_INPUT_MICROS_PER_M:2000000}
    output-micros-per-million-tokens: ${DRA_LLM_OUTPUT_MICROS_PER_M:8000000}
  verify:
    confidence:
      judge-weight: ${DRA_VERIFY_JUDGE_WEIGHT:0.5}
      rule-weight: ${DRA_VERIFY_RULE_WEIGHT:0.3}
      diversity-weight: ${DRA_VERIFY_DIVERSITY_WEIGHT:0.2}
      conflict-penalty: ${DRA_VERIFY_CONFLICT_PENALTY:0.2}
      max-penalized-conflicts: ${DRA_VERIFY_MAX_PENALIZED_CONFLICTS:1}
  worker:
    roles: ${DRA_WORKER_ROLES:orchestration,io,llm}
    io-concurrency: ${DRA_IO_CONCURRENCY:50}
    llm-concurrency: ${DRA_LLM_CONCURRENCY:20}
    plan-sleep-ms: ${DRA_STUB_PLAN_MS:800}
    search-sleep-ms: ${DRA_STUB_SEARCH_MS:600}
    fetch-sleep-ms: ${DRA_STUB_FETCH_MS:600}
    extract-sleep-ms: ${DRA_STUB_EXTRACT_MS:600}
    coverage-sleep-ms: ${DRA_STUB_COVERAGE_MS:400}
    synthesize-sleep-ms: ${DRA_STUB_SYNTHESIZE_MS:400}
    verify-sleep-ms: ${DRA_STUB_VERIFY_MS:300}
    report-sleep-ms: ${DRA_STUB_REPORT_MS:500}
    coverage-ratio: ${DRA_STUB_COVERAGE_RATIO:0.85}

logging:
  level:
    com.dra: INFO
    io.temporal: WARN
